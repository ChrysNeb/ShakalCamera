name: Ошибка в камере
description: Помогите шакалам стать прекраснее
title: '[Bug] '
body:
  - type: input
    id: device
    attributes:
      label: Модель телефона и версия Android
      placeholder: Например, Pixel 8 / Android 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      description: Фото или видео, уровень, режим ресемплинга, последовательность действий.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что произошло и чего ожидали
    validations:
      required: true
  - type: markdown
    attributes:
      value: Не прикладывайте личные фото, видео или другие приватные данные.
